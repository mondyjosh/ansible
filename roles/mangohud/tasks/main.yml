- name: "MangoHud | Set Distribution Config: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: mangohud_distribution_config
  tags:
    - mangohud

- name: "MangoHud | {{ansible_distribution}} | Run Tasks"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: mangohud_distribution_config.stat.exists
  tags:
    - install
    - mangohud

