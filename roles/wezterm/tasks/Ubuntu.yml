- name: "WezTerm | Ubuntu | Download WezTerm GPG key and convert to keyring"
  shell: |
    curl -fsSL https://apt.fury.io/wez/gpg.key \
      | gpg --yes --dearmor -o {{ wezterm_keyring }}
  args:
    creates: "{{ wezterm_keyring_path }}"
  tags:
    - install
    - wezterm

- name: "WezTerm | Ubuntu | Ensure correct permissions on keyring"
  file:
    path: "{{ wezterm_keyring }}"
    mode: '0644'

- name: "WezTerm | Ubuntu | Add WezTerm repo"
  copy:
    dest: /etc/apt/sources.list.d/wezterm.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://apt.fury.io/wez/
      Suites: *
      Components: *
      Architectures: amd64 arm64
      Signed-By: {{ wezterm_keyring_path }}
  tags:
    - install
    - wezterm

- name: "WezTerm | Ubuntu | Update apt cache"
  apt:
    update_cache: yes
  tags:
    - install
    - wezterm

# If you want nightly build, then replace wezterm by wezterm-nightly
# The nightly build conflicts with the regular build,
# so you may install one or the other, but not both at the same time.
- name: "WezTerm | Ubuntu | Install WezTerm"
  apt:
    name: codium
    state: latest
  tags:
    - install
    - wezterm
