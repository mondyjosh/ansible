- name: "VSCodium | Set Distribution Config: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: vscodium_config
  tags:
    - vscodium

- name: "VSCodium | {{ ansible_distribution }} | Run Tasks"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: vscodium_config.stat.exists
  tags:
    - install
    - vscodium
