- name: "Vulkan | Set Distribution Config: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: vulkan_distribution_config
  tags:
    - gaming
    - vulkan

- name: "Vulkan | {{ ansible_distribution }} | Run Tasks"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: vulkan_distribution_config.stat.exists
  tags:
    - gaming
    - install
    - vulkan
