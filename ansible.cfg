[defaults]
# Path to the inventory file. Using localhost as the default target for playbooks
inventory = inventories/localhost.ini

# Enable the 'profile_tasks' callback plugin for task diagnostics
callbacks_enabled = profile_tasks

# Force Ansible to use color output even in piped logs
force_color = True

# Default Python interpreter (especially for Windows/WSL setups)
ansible_python_interpreter = /usr/bin/python3

# Set connection type to local by default (can be overridden per host)
connection = local
