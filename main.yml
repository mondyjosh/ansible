# Run this playbook with: ansible-playbook main.yml -K
- name: "Workstation Setup - mondyjosh"
  hosts: localhost
  connection: local

  pre_tasks:
    - name: "Execute Pre-Tasks"
      ansible.builtin.include_tasks: pre_tasks/main.yml

  tasks:
    # TODO: Set up multiple playbooks (minimum/workstation/playstation)?
    # - name: "Include roles - 👔 Workstation"
    #   ansible.builtin.set_fact:
    #     run_roles: "{{ workstation_roles }}"
    #   tags:
    #     - always
    #     - workstation

    - name: "Include roles - 🌱 Minimum"
      ansible.builtin.set_fact:
        run_roles: "{{ minimum_roles }}"
      tags:
        - always
        - minimum

    - name: "Display roles"
      ansible.builtin.debug:
        var: run_roles
      tags:
        - always

    - name: "Run roles"
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ run_roles }}"
      tags:
        - always