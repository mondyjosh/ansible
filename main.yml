# Run this playbook with: ansible-playbook main.yml -K
- name: "Workstation Setup - mondyjosh"
  hosts: localhost
  connection: local

  pre_tasks:
    - name: "Metrics | Record playbook start time 🟢"
      set_fact:
        playbook_started_at: "{{ ansible_date_time.iso8601 }}"
      tags: [always, metrics]

    - name: "Execute Pre-Tasks"
      ansible.builtin.include_tasks: pre_tasks/main.yml

  tasks:
    - name: "Include roles - 🌱 Minimum"
      ansible.builtin.set_fact:
        run_roles: "{{ minimum_roles }}"
      tags: [always, minimum-roles]

    # - name: "Include roles - 💼 Workstation"
    #   ansible.builtin.set_fact:
    #     run_roles: "{{ (run_roles | default([])) + workstation_roles }}"
    #   tags: [workstation-roles]

    # - name: "Include roles - 💼 Playstation"
    #   ansible.builtin.set_fact:
    #     run_roles: "{{ (run_roles | default([])) + playstation_roles }}"
    #   tags: [playstation-roles]

    - name: "Display roles"
      ansible.builtin.debug:
        var: run_roles
      tags: [always]

    - name: "Execute roles"
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      loop: "{{ run_roles }}"
      tags: [always]

    - name: "Simulate work"
      ansible.builtin.pause:
        seconds: 5
      tags: [always]

