
- name: "Firefox | Set Distribution Config: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: firefox_config
  tags:
    - firefox

- name: "Firefox | {{ ansible_distribution }} | Run Tasks"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: firefox_config.stat.exists
  tags:
    - install
    - firefox 
