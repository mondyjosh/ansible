- name: "Flameshot | Set Distribution Config: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: flameshot_config
  tags:
    - flameshot

- name: "Flameshot | {{ ansible_distribution }} | Run Tasks"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: flameshot_config.stat.exists
  tags:
    - install
    - flameshot 
