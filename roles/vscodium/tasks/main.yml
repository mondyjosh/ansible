- name: "Zoom | Set Distribution Config: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: zoom_config
  tags:
    - zoom

- name: "Zoom | {{ ansible_distribution }} | Run Tasks"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: zoom_config.stat.exists
  tags:
    - install
    - zoom
